name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin ships for Windows x64 and macOS arm64 only; see README.md.
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build TodoList.Plugin.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test TodoList.Plugin.slnx -c Release --no-build

      - name: Install the plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.0-beta.16

      # TEMPORARY: reproduces MDC0604 repeatedly and prints what the host saw when the plugin stays live.
      - name: Shutdown diagnostics
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          TODO_DIAG_PLUGIN: ${{ github.workspace }}/src/TodoList.Plugin/bin/Release/net10.0/TodoList.Plugin.dll
        run: dotnet test tests/TodoList.Plugin.Tests -c Release --no-build --filter "TestCategory=ShutdownDiagnostics" --logger "console;verbosity=detailed"

      # Proves the conformance suite on every supported platform before a release does.
      - name: Conformance
        run: macrodeck-plugin test --project src/TodoList.Plugin --required-only

      # The release runs the packed plugin as a managed subject, which a project run is not; only that mode
      # must stop when Macro Deck shuts it down, so the package is checked the same way here.
      - name: Build the package
        run: macrodeck-plugin build --source src/TodoList.Plugin --output ./artifacts

      - name: Conformance of the package
        shell: bash
        run: macrodeck-plugin test --artifact ./artifacts/*.macroDeckPlugin --required-only

  package:
    name: Pack and validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install the plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.0-beta.16

      - name: Build the package
        run: macrodeck-plugin build --source src/TodoList.Plugin --output ./artifacts

      - name: Validate the package
        run: macrodeck-plugin validate --level publication --artifact ./artifacts/*.macroDeckPlugin
